<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  
  <meta property="og:title" content="キャラ情報" />
  <meta property="og:site_name" content="キャラチェッカー" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ten-soba.github.io/pri-checker/chars" />
  <meta property="og:description" content="キャラの所持状況確認用" />


  <!-- CSSで最初から非表示 -->
  <style>
    .q-header.q-layout__section--marginal.fixed-top.bg-primary.text-white,
    .q-card[style="width: fit-content;"] {
      display: none !important;
    }
    .q-toolbar__title.ellipsis {
      visibility: hidden !important;
    }
  </style>

  <!-- JSで確実に非表示 -->
  <script>
    window.addEventListener('load', () => {
    // 自己紹介カードだけ非表示
  const introCard = document.querySelector('.q-card[style="width: fit-content;"]');
  if (introCard) introCard.style.display = 'none';

  // タイトルテキストだけ空にする（要素自体は残す）
  const title = document.querySelector('.q-toolbar__title.ellipsis');
  if (title) title.textContent = '';
});
  </script>
</head>
