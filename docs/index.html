<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>プリコネ所持キャラチェッカー</title>
    <script>
      const path = sessionStorage.getItem("path");
      const targetPathRegex = /\/pri-checker\/(.*)/;
      if (path && targetPathRegex.test(path)) {
        sessionStorage.removeItem("path");
        const targetPath = path.match(targetPathRegex)[1];
        window.history.replaceState(null, null, targetPath);
      }
    </script>
    <script type="module" crossorigin src="/pri-checker/assets/index-BUBYIcv4.js"></script>
    <link rel="stylesheet" crossorigin href="/pri-checker/assets/index-CI5Bdk_T.css">

  </head>
  <body>
    <div id="app"></div>

    
    <script>
      // ページ表示後にヘッダー等を非表示にする処理
      window.addEventListener('load', () => {
        const header = document.querySelector('.q-header.q-layout__section--marginal.fixed-top.bg-primary.text-white');
        if (header) header.style.display = 'none';

        const introCard = document.querySelector('.q-card[style="width: fit-content;"]');
        if (introCard) introCard.style.display = 'none';

        const title = document.querySelector('.q-toolbar__title.ellipsis');
        if (title) title.textContent = '';
      });
    </script>
  </body>
</html>
